[project]
name = "conversational_travel_planner"
version = "0.1.0"
description = "LangChain Travel Planner with FastAPI and MongoDB"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bcrypt>=4.3.0",
    "fastapi>=0.116.1",
    "langchain>=0.3.27",
    "langchain-google-genai>=2.1.10",
    "langsmith>=0.4.20",
    "passlib[bcrypt]>=1.7.4",
    "pydantic>=2.11.7",
    "pyjwt>=2.10.1",
    "pymongo>=4.14.1",
    "python-dotenv>=1.1.1",
    "uvicorn>=0.35.0",
]
